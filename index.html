<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Vibralizer FS-4: a vintage-style music app from the FS family." />
    <meta name="theme-color" content="#24211d" />
    <title>Vibralizer FS-4</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23ff2a14'/%3E%3C/svg%3E" />
    <!-- Installable app: manifest for Android/Chrome, meta tags and touch icon for iOS home screens -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vibralizer" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <script>
      // On its own (not embedded in another page) the page gets a solid backdrop; embedded, it
      // stays transparent so the host page shows around the device.
      if (window.self === window.top) document.documentElement.classList.add('solo');
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        place-items: center;
        /* Keep clear of notches, rounded corners and the home indicator. */
        padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        box-sizing: border-box;
        background: transparent;
      }
      /* Phones in portrait and short screens (phones held sideways): every pixel of height counts. */
      @media (max-width: 720px) and (orientation: portrait) {
        body {
          padding-top: max(12px, env(safe-area-inset-top));
          padding-bottom: max(12px, env(safe-area-inset-bottom));
        }
      }
      @media (max-height: 520px) {
        body {
          padding-top: max(8px, env(safe-area-inset-top));
          padding-bottom: max(8px, env(safe-area-inset-bottom));
        }
      }
      /*
       * Installed as an app there is no host page behind it, so give it a dark backdrop. The app
       * scales itself to fit the window, so the page never needs to scroll: no scrollbars at all.
       */
      @media (display-mode: standalone) {
        html {
          background: #24211d;
          overflow: hidden;
        }
        body {
          overscroll-behavior: none;
        }
      }
      /*
       * On its own page the device sits on a solid warm charcoal, a little lighter than the panel
       * so the case's drop shadow still reads, and matching the theme colour.
       */
      html.solo {
        min-height: 100%;
        background: #24211d;
      }
      vibralizer-app:not(:defined) {
        display: none;
      }
    </style>

    .bezel {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: conic-gradient(from 200deg, #6d6d68, #f2f2ee, #8b8b86, #e0e0db, #6d6d68, #cfcfca, #6d6d68);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.7),
        0 3px 5px rgba(0, 0, 0, 0.6),
        inset 0 0 0 1px rgba(255, 255, 255, 0.25);
    }
    .led {
      position: relative;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 55%, #163a1d, #08190c 75%);
      box-shadow:
        0 0 0 2px #121211,
        inset 0 2px 4px rgba(0, 0, 0, 0.8);
    }
    .led::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 5px;
      width: 9px;
      height: 6px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0) 70%);
    }
    /* Lit colour and glow come from tuneLed(): green when in tune, through yellow to red. */
    .led.on {
      background: radial-gradient(circle at 50% 55%, var(--led-core) 0%, var(--led-mid) 35%, var(--led-edge) 80%);
      box-shadow:
        0 0 0 2px #121211,
        0 0 16px 6px var(--led-glow),
        0 0 40px 10px var(--led-halo);
    }

    /* Plastic keycaps seated in dark panel cut-outs */
    button {
      font: inherit;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    button:focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 4px;
    }
    .key {
      --cap-top: #f2ead4;
      --cap-mid: #e2d8bf;
      --cap-low: #c6bb9f;
      position: relative;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background:
        var(--grain),
        linear-gradient(180deg, var(--cap-top) 0%, var(--cap-mid) 55%, var(--cap-low) 100%);
      background-size: 120px 120px, auto;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.75),
        inset 0 -5px 0 rgba(0, 0, 0, 0.16),
        inset 0 -6px 3px rgba(0, 0, 0, 0.08),
        0 0 0 2px #0e0e0d,
        0 0 0 3px rgba(255, 255, 255, 0.05),
        0 5px 7px 1px rgba(0, 0, 0, 0.55);
      transition:
        transform 0.05s,
        box-shadow 0.05s;
    }
    /* Slightly dished top face */
    .key::before {
      content: '';
      position: absolute;
      inset: 5px 5px 9px;
      border-radius: 3px;
      background: radial-gradient(ellipse at 50% 20%, rgba(255, 255, 255, 0.35), transparent 70%);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.08);
      pointer-events: none;
    }
    .key:active {
      transform: translateY(2px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.6),
        inset 0 -3px 0 rgba(0, 0, 0, 0.16),
        0 0 0 2px #0e0e0d,
        0 0 0 3px rgba(255, 255, 255, 0.05),
        0 2px 3px rgba(0, 0, 0, 0.6);
    }
    .key .key-led {
      position: absolute;
      top: 9px;
      left: 50%;
      width: 10px;
      height: 10px;
      margin-left: -5px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.55) 0 1px, transparent 2.5px),
        radial-gradient(circle at 50% 50%, #6e2016, #360b06);
      box-shadow:
        0 0 0 1.5px rgba(0, 0, 0, 0.35),
        0 1px 0 1.5px rgba(255, 255, 255, 0.35);
      z-index: 1;
    }
    .key .key-led.on {
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.85) 0 1px, transparent 2.5px),
        radial-gradient(circle at 50% 50%, #ffb39f, #ff3a1c 55%, #c01a06);
      box-shadow:
        0 0 0 1.5px rgba(0, 0, 0, 0.3),
        0 0 7px 3px rgba(255, 58, 28, 0.6);
    }
    .start {
      width: var(--start-width);
    }
    /*
     * The displays' frames are drawn up to 5px outside their boxes, the keys' outline 2px; stretch
     * the keys 3px past their row so their outer edges line up with the displays.
     */
    .controls .start,
    .controls .fork {
      align-self: stretch;
      margin-block: -3px;
    }
    .start-label {
      color: #e0533d;
    }

    /* Instrument selector */
    .modes {
      display: grid;
      /* The instruments, then the tuner key */
      grid-template-columns: repeat(${V.length+1}, minmax(0, 1fr));
      gap: 0.6rem 1.2rem;
      justify-items: center;
      padding: 1.4rem 2.4rem 1.5rem;
      border-top: 1px solid rgba(0, 0, 0, 0.65);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.2));
    }
    .modes .title {
      grid-column: 1 / -1;
      justify-self: start;
    }
    .mode {
      justify-self: stretch;
      height: 60px;
    }
    /* The instrument and tuner keys' LEDs are green (On / Off and Tone keep red) */
    .mode .key-led {
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.55) 0 1px, transparent 2.5px),
        radial-gradient(circle at 50% 50%, #1d5a2a, #0b2812);
    }
    .mode .key-led.on {
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.85) 0 1px, transparent 2.5px),
        radial-gradient(circle at 50% 50%, #c6ffd2, #3ef06a 55%, #129c3a);
      box-shadow:
        0 0 0 1.5px rgba(0, 0, 0, 0.3),
        0 0 7px 3px rgba(62, 240, 106, 0.55);
    }
    .icon {
      width: 44px;
      height: 44px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.9;
    }
    .icon .fill {
      fill: currentColor;
    }
    .caption {
      margin-top: -0.3rem;
    }

    /*
     * Examples, above the instrument keys and across their row: the slider, a readout with the
     * player's name, and the Play and You keys, their names lettered above them.
     */
    .examples {
      grid-column: 1 / -1;
      justify-self: stretch;
      display: grid;
      grid-template-columns: minmax(140px, 240px) minmax(0, 1fr) auto auto auto;
      align-items: end;
      gap: 0.5rem 1.2rem;
      margin-bottom: 0.7rem;
    }
    .examples .title {
      grid-column: 1 / -1;
      justify-self: start;
    }
    /* Amber lettering in a recessed window, like the display's readouts */
    .example-readout {
      display: flex;
      align-items: center;
      min-width: 0;
      height: 40px;
      margin-bottom: 3px;
      padding: 0 0.9rem;
      box-sizing: border-box;
      font: 700 0.8rem/1 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffb347;
      text-shadow: 0 0 6px rgba(255, 150, 50, 0.65);
      border-radius: 3px;
      background: #0a0b0a;
      box-shadow:
        inset 0 2px 6px rgba(0, 0, 0, 0.95),
        0 0 0 2px #141412,
        0 0 0 3px #050505,
        0 1px 0 3px rgba(255, 255, 255, 0.08);
    }
    .example-readout span {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .example-key {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.45rem;
    }
    /* Reverb on your note, right of You: a knob as tall as the keys beside it */
    .examples .reverb {
      --knob-size: 43px;
      margin-bottom: 0;
    }
    /*
     * Play and You, Polka FS-3's transport keys in the panel's cream: the icon on the cap, no
     * LED; playing, the key turns into Stop and its icon lights up green.
     */
    .key.transport-key {
      --transport-key: 40px;
      display: grid;
      place-items: center;
      width: 52px;
      height: var(--transport-key);
      margin-bottom: 3px;
      padding: 0 0 4px;
      color: rgba(40, 37, 30, 0.82);
    }
    .transport-key.active {
      --glow: #4cdf6a;
    }
    .transport-key:disabled {
      cursor: default;
    }
    .transport-key:disabled .cap-icon {
      opacity: 0.3;
    }
    .transport-key.active .cap-icon {
      color: color-mix(in srgb, var(--glow) 35%, white);
      filter: drop-shadow(0 0 2px var(--glow)) drop-shadow(0 0 5px var(--glow));
    }
    .cap-icon {
      position: relative;
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    /* Phones: the slider across the panel, the readout and keys on the line below */
    @media (max-width: 720px) {
      .examples {
        grid-template-columns: minmax(0, 1fr) auto auto auto;
        row-gap: 0.4rem;
      }
      .examples step-slider {
        grid-column: 1 / -1;
      }
    }
    /*
     * Phones held sideways: no height for another line, so a shorter slider, smaller lettering and
     * key keep all three on one.
     */
    @media (orientation: landscape) and (max-height: 520px) {
      .examples {
        grid-template-columns: minmax(80px, 110px) minmax(0, 1fr) auto auto auto;
        column-gap: 0.5rem;
        margin-bottom: 0.3rem;
      }
      .examples step-slider {
        grid-column: auto;
      }
      .example-readout {
        height: 34px;
        padding: 0 0.6rem;
        font-size: 0.66rem;
        letter-spacing: 0.04em;
      }
      /* As Polka's transport keys on short screens */
      .key.transport-key {
        --transport-key: 34px;
        width: 42px;
      }
      .example-key {
        gap: 0.25rem;
      }
      .examples .reverb {
        --knob-size: 37px;
      }
      .example-key .label {
        font-size: 0.54rem;
      }
    }

    footer {
      padding: 0.7rem 2.4rem 0.8rem;
      font-size: 0.68rem;
      text-align: center;
      color: rgba(232, 225, 204, 0.45);
      border-top: 1px solid rgba(0, 0, 0, 0.6);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    kbd {
      font: inherit;
      font-weight: 700;
      padding: 0 0.3em;
      border: 1px solid rgba(232, 225, 204, 0.35);
      border-radius: 3px;
    }

    /*
     * Tip button between the name and the badges: a key like the others, but with a cap of brushed
     * aluminium, so it looks machined from the strip it sits in; the cup and lettering are etched
     * like the logo.
     */
    .tip-button {
      display: flex;
      flex: none;
      align-items: center;
      gap: 0.45rem;
      /* As tall as the FS-4 badge and the visit counter */
      height: calc(0.68 * 1.39 * var(--brand-size) + 0.22rem);
      padding: 0 0.85rem 0 0.7rem;
      box-sizing: border-box;
      white-space: nowrap;
      font-family: var(--label-font);
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      color: rgba(34, 32, 27, 0.85);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
      border-radius: 5px;
      background:
        var(--brushed),
        linear-gradient(180deg, #f6f6f1 0%, #d6d6d0 48%, #c0c0ba 52%, #b2b2ac 100%);
      background-size: 300px 60px, auto;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        inset 0 -2px 0 rgba(0, 0, 0, 0.2),
        0 0 0 1.5px #2b2a26,
        0 0 0 2.5px rgba(255, 255, 255, 0.4),
        0 3px 4px rgba(0, 0, 0, 0.45);
      -webkit-tap-highlight-color: transparent;
      transition:
        transform 0.05s,
        box-shadow 0.05s,
        filter 0.15s;
    }
    .tip-button:hover {
      filter: brightness(1.06);
    }
    .tip-button:active {
      transform: translateY(1.5px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.7),
        inset 0 -1px 0 rgba(0, 0, 0, 0.2),
        0 0 0 1.5px #2b2a26,
        0 0 0 2.5px rgba(255, 255, 255, 0.4),
        0 1px 2px rgba(0, 0, 0, 0.5);
    }
    .tip-button:focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 4px;
    }
    .tip-icon {
      flex: none;
      width: 1.5em;
      height: 1.5em;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0.8px 0 rgba(255, 255, 255, 0.65));
    }
    /* Narrow screens: no room in the strip, so the tip moves to the line under the device */
    @media (max-width: ${ss-1}px) {
      .tip-button {
        display: none;
      }
    }
    @media (min-width: ${ss}px) {
      .tip {
        display: none;
      }
    }
    /*
     * Tip line under the device. The page behind it may be light or dark, so it uses a mid-tone
     * that reads on both.
     */
    .tip {
      margin: 1.1rem 0 0;
      font-size: 0.78rem;
      line-height: 1.5;
      text-align: center;
      color: #8c8577;
    }
    /* Where the full sentence would wrap, fitTip() switches to just the link. */
    .tip-short,
    .tip.short .tip-long {
      display: none;
    }
    .tip.short .tip-short {
      display: inline;
    }
    .tip a {
      color: #e0533d;
      font-weight: 700;
      text-decoration: none;
      border-radius: 2px;
      -webkit-tap-highlight-color: transparent;
    }
    .tip a:hover {
      text-decoration: underline;
    }
    .tip a:focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 3px;
    }

    /*
     * Below the width where the single row fits, and in the controls panel of the landscape
     * layout: two rows on four columns. On/off key, input knob (free to use the tone key's column)
     * and tuning LED on top; the reference display under the first two, with the tone key and
     * volume knob to its right, the LED centred over the knob.
     */
    @media (max-width: 900px), (orientation: landscape) and (max-height: 520px) {
      .controls {
        grid-template-columns: auto minmax(0, 1fr) auto auto;
        grid-template-rows: var(--panel-height) auto var(--panel-height) auto;
      }
      .controls .start {
        grid-area: 1 / 1;
      }
      /* Knob, meter and their label centred in the space between the on/off key and the LED */
      .controls .input-cell,
      .controls .input-label {
        justify-self: center;
      }
      .controls .input-cell {
        grid-area: 1 / 2 / 2 / 4;
      }
      .controls .led-cell {
        grid-area: 1 / 4;
      }
      .controls .start-label {
        grid-area: 2 / 1;
      }
      .controls .input-label {
        grid-area: 2 / 2 / 3 / 4;
      }
      .controls .led-label {
        grid-area: 2 / 4;
      }
      .controls value-display {
        grid-area: 3 / 1 / 4 / 3;
      }
      .controls .fork {
        grid-area: 3 / 3;
      }
      .controls .volume {
        grid-area: 3 / 4;
      }
      .controls .ref-label {
        grid-area: 4 / 1 / 5 / 3;
      }
      .controls .tone-label {
        grid-area: 4 / 3;
      }
      .controls .volume-label {
        grid-area: 4 / 4;
      }
    }

    @media (max-width: 720px), (orientation: landscape) and (max-height: 520px) {
      :host {
        --start-width: 72px;
      }
      .cheek {
        flex-basis: 12px;
      }
      header {
        padding: 0.9rem 2.2rem 0.75rem 1.6rem;
      }
      .display-section {
        padding: calc(1.25rem + 5px) calc(1rem + 5px) 5px;
      }
      .led-cell .bezel {
        width: 44px;
        height: 44px;
      }
      .led-cell .led {
        width: 28px;
        height: 28px;
      }
      .led-cell .led::after {
        top: 4px;
        left: 6px;
        width: 10px;
        height: 7px;
      }
      /* Compact controls; the digits shrink with the screen so the display row always fits. */
      .controls {
        --panel-height: 72px;
        --knob-size: 60px;
        --input-gap: 0.3rem;
        --digit-size: clamp(1.8rem, 7.5vw, 3rem);
        gap: 0.6rem 0.6rem;
        padding: 1.25rem 1rem;
      }
      .controls .volume {
        --knob-size: 56px;
      }
      /* Narrower knob and gap: tighter letter spacing keeps "Input +24 dB" within the label. */
      .label.input-label {
        letter-spacing: 0.1em;
      }
      .fork {
        width: 64px;
      }
      .fork-icon {
        bottom: 9px;
        width: 34px;
        height: 34px;
        margin-left: -17px;
      }
      .ref-label .dim {
        display: none;
      }
      .label {
        white-space: normal;
      }
      .modes {
        gap: 0.5rem 0.6rem;
        padding: 1.25rem 1rem;
      }
      .mode {
        height: 52px;
      }
      .icon {
        width: 36px;
        height: 36px;
      }
      /* Keyboard hints are no use on touch screens; keep the strip for the screws. */
      footer {
        padding: 0;
        height: 30px;
      }
      .hints {
        display: none;
      }
    }

    /*
     * Narrower than today's phones: the reference display gets a row of its own, with the tone key
     * and volume knob below it, and the instrument captions don't run together.
     */
    @media (max-width: 359px) {
      .controls {
        grid-template-rows: repeat(3, var(--panel-height) auto);
      }
      .controls value-display {
        grid-area: 3 / 1 / 4 / 5;
      }
      .controls .ref-label {
        grid-area: 4 / 1 / 5 / 5;
      }
      .controls .fork {
        grid-area: 5 / 3;
      }
      .controls .volume {
        grid-area: 5 / 4;
      }
      .controls .tone-label {
        grid-area: 6 / 3;
      }
      .controls .volume-label {
        grid-area: 6 / 4;
      }
      .caption {
        letter-spacing: 0.06em;
      }
    }
    /*
     * Six keys share the row on phones and in the landscape controls panel: smaller, tighter
     * captions, so "Flute", "Trumpet" and "Tuner" keep clear of each other.
     */
    @media (max-width: 720px), (orientation: landscape) and (max-height: 520px) {
      .modes {
        column-gap: 0.4rem;
      }
      .caption {
        font-size: 0.56rem;
        letter-spacing: 0.04em;
      }
    }

    /*
     * Phones in portrait: slimmer header, padding, instrument keys and footer, so the display
     * keeps as much height as it can.
     */
    @media (max-width: 720px) and (orientation: portrait) {
      :host {
        --min-display: 200px;
      }
      header {
        padding: 0.6rem 2.2rem 0.5rem 1.6rem;
      }
      .controls {
        padding: 1rem;
      }
      .modes {
        gap: 0.4rem 0.6rem;
        padding: 0.8rem 1rem 0.9rem;
      }
      .mode {
        height: 44px;
      }
      .icon {
        width: 28px;
        height: 28px;
      }
      footer {
        height: 20px;
      }
      .tip {
        margin-top: 0.5rem;
      }
    }

    /*
     * Landscape on phones (and other short screens): the display on the left at full height, the
     * controls panel beside it, so the device spans the full width instead of shrinking to fit the
     * height. A groove divides the two; everything is sized down to fit a phone's height.
     */
    @media (orientation: landscape) and (max-height: 520px) {
      :host {
        --start-width: 64px;
        --min-display: 150px;
      }
      .panels {
        display: grid;
        flex: 1;
        min-height: 0;
        grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
      }
      .display-section {
        padding: calc(0.8rem + 5px) calc(0.8rem + 5px) calc(0.8rem + 5px) calc(0.8rem + 15px);
        border-right: 1px solid rgba(0, 0, 0, 0.65);
        box-shadow: 1px 0 0 rgba(255, 255, 255, 0.06);
      }
      .controls-panel {
        justify-content: center;
      }
      header {
        --brand-size: 1.25rem;
        padding: 0.4rem 2.2rem 0.35rem 1.6rem;
      }
      .controls {
        --panel-height: 58px;
        --knob-size: 50px;
        row-gap: 0.35rem;
        padding: 0.8rem 1rem 0.5rem;
      }
      .start-label,
      .input-label,
      .led-label {
        padding-bottom: 0.6rem;
      }
      .controls .volume {
        --knob-size: 46px;
      }
      .fork {
        width: 56px;
      }
      .fork-icon {
        bottom: 7px;
        width: 28px;
        height: 28px;
        margin-left: -14px;
      }
      .led-cell .bezel {
        width: 40px;
        height: 40px;
      }
      .led-cell .led {
        width: 26px;
        height: 26px;
      }
      /* Instrument keys in one row: keys and captions, no icons. */
      .modes {
        gap: 0.3rem 0.5rem;
        padding: 0.5rem 1rem 0.6rem;
      }
      .mode {
        height: 44px;
      }
      .mode .key-led {
        top: 6px;
      }
      .icon {
        display: none;
      }
      .caption {
        margin-top: 0;
      }
      footer {
        height: 16px;
      }
      .tip {
        margin-top: 0.35rem;
