<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Vibralizer FS-4: a vintage-style music app from the FS family." />
    <meta name="theme-color" content="#24211d" />
    <title>Vibralizer FS-4</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23ff2a14'/%3E%3C/svg%3E" />
    <!-- Installable app: manifest for Android/Chrome, meta tags and touch icon for iOS home screens -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vibralizer" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <script>
      // On its own (not embedded in another page) the page gets a solid backdrop; embedded, it
      // stays transparent so the host page shows around the device.
      if (window.self === window.top) document.documentElement.classList.add('solo');
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        place-items: center;
        /* Keep clear of notches, rounded corners and the home indicator. */
        padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        box-sizing: border-box;
        background: transparent;
      }
      /* Phones in portrait and short screens (phones held sideways): every pixel of height counts. */
      @media (max-width: 720px) and (orientation: portrait) {
        body {
          padding-top: max(12px, env(safe-area-inset-top));
          padding-bottom: max(12px, env(safe-area-inset-bottom));
        }
      }
      @media (max-height: 520px) {
        body {
          padding-top: max(8px, env(safe-area-inset-top));
          padding-bottom: max(8px, env(safe-area-inset-bottom));
        }
      }
      /*
       * Installed as an app there is no host page behind it, so give it a dark backdrop. The app
       * scales itself to fit the window, so the page never needs to scroll: no scrollbars at all.
       */
      @media (display-mode: standalone) {
        html {
          background: #24211d;
          overflow: hidden;
        }
        body {
          overscroll-behavior: none;
        }
      }
      /*
       * On its own page the device sits on a solid warm charcoal, a little lighter than the panel
       * so the case's drop shadow still reads, and matching the theme colour.
       */
      html.solo {
        min-height: 100%;
        background: #24211d;
      }
      vibralizer-app:not(:defined) {
        display: none;
      }
    </style>

      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.6),
        0 1px 2px rgba(0, 0, 0, 0.7),
        inset 0 -1px 1px rgba(0, 0, 0, 0.4);
      z-index: 1;
    }
    .screw::before,
    .screw::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 8px;
      height: 2px;
      margin: -1px 0 0 -4px;
      background: #3d3d39;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
      transform: rotate(var(--angle, 20deg));
    }
    .screw::after {
      transform: rotate(calc(var(--angle, 20deg) + 90deg));
    }
    .screw.tl {
      top: 9px;
      left: 9px;
      --angle: 20deg;
    }
    .screw.tr {
      top: 9px;
      right: 9px;
      --angle: 65deg;
    }
    .screw.bl {
      bottom: 9px;
      left: 9px;
      --angle: 40deg;
    }
    .screw.br {
      bottom: 9px;
      right: 9px;
      --angle: 5deg;
    }

    /* Brushed aluminium name strip; the brand's size is shared with the badge, counter and tip button */
    header {
      --brand-size: clamp(1.3rem, 4vw, 1.85rem);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.95rem 2.4rem 0.85rem;
      color: #26251f;
      background:
        var(--brushed),
        linear-gradient(90deg, #9d9d97 0%, #d9d9d3 22%, #b5b5af 45%, #e4e4de 68%, #c2c2bc 85%, #9a9a94 100%);
      background-size: 600px 120px, auto;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.7),
        inset 0 -1px 0 rgba(0, 0, 0, 0.35),
        0 2px 3px rgba(0, 0, 0, 0.55);
    }
    .brand {
      display: flex;
      flex: none;
      align-items: center;
      gap: 0.7rem;
      font-size: var(--brand-size);
    }
    /*
     * Laser-etched into the aluminium: slightly translucent dark lines so the brushed grain still
     * shows through, a soft burn halo around them, and a bright edge below where the groove catches
     * the light.
     */
    .logo {
      flex: none;
      width: 1.3em;
      height: 1.3em;
      margin-right: -0.15rem;
      color: rgba(28, 25, 20, 0.78);
      filter: drop-shadow(0 0 0.8px rgba(40, 30, 20, 0.45)) drop-shadow(0 0.8px 0 rgba(255, 255, 255, 0.65));
    }
    /*
     * The wordmark, etched like the logo: translucent dark strokes with a burn halo and a bright
     * lower edge, and the inline groove cut down to bare, brighter metal.
     */
    .wordmark {
      flex: none;
      height: 1.25em;
      width: auto;
      aspect-ratio: 255 / 44;
      filter: drop-shadow(0 0 0.8px rgba(40, 30, 20, 0.45)) drop-shadow(0 0.8px 0 rgba(255, 255, 255, 0.65));
    }
    .wordmark .ink {
      stroke: rgba(28, 25, 20, 0.8);
    }
    .wordmark .inline {
      stroke: rgba(225, 225, 218, 0.7);
    }
    /*
     * Right of the strip: the visit counter, then the FS-4 badge, sized from the brand. When the
     * strip is too narrow for both (phones), the badge wraps onto a second row, which is clipped
     * away: one row tall, plus a margin so shadows aren't cut off, and a row gap wide enough that
     * none of the wrapped badge shows in that margin. The empty ::before is a row tall, so even
     * without the counter there is something for the badge to wrap behind.
     */
    .badges {
      --row: calc(0.68 * 1.39 * var(--brand-size) + 0.22rem);
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 1rem 0.7rem;
      min-width: 0;
      height: var(--row);
      padding: 4px;
      margin: -4px;
      overflow: hidden;
      font-size: var(--brand-size);
    }
    .badges::before {
      content: '';
      height: var(--row);
      margin-right: -0.7rem;
    }
    .model {
      flex: none;
      white-space: nowrap;
      padding: 0.12rem 0.5rem 0.1rem;
      font-style: normal;
      font-size: 0.68em;
      /* Set rather than left to the font, so the visit counter can be made exactly as tall */
      line-height: 1.39;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #f3ecd8;
      text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.35);
      background: linear-gradient(180deg, #d24a35, #a8301f);
      border-radius: 3px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.3),
        inset 0 -1px 0 rgba(0, 0, 0, 0.3),
        0 1px 0 rgba(255, 255, 255, 0.5);
    }
    /*
     * Help: a round key of brushed aluminium with an etched "?", as tall as the FS-4 badge, first in
     * the badges so it stays when the badge wraps away on narrow strips
     */
    .help {
      flex: none;
      display: grid;
      place-items: center;
      width: calc(0.68 * 1.39 * var(--brand-size) + 0.22rem);
      height: calc(0.68 * 1.39 * var(--brand-size) + 0.22rem);
      border-radius: 50%;
      font: 800 0.62em/1 var(--label-font);
      text-decoration: none;
      color: rgba(34, 32, 27, 0.85);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
      background:
        var(--brushed),
        radial-gradient(circle at 40% 30%, #f6f6f1 0%, #d6d6d0 50%, #b2b2ac 100%);
      background-size: 300px 60px, auto;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        inset 0 -2px 0 rgba(0, 0, 0, 0.2),
        0 0 0 1.5px #2b2a26,
        0 0 0 2.5px rgba(255, 255, 255, 0.4),
        0 2px 3px rgba(0, 0, 0, 0.45);
      -webkit-tap-highlight-color: transparent;
    }
    .help:hover {
      filter: brightness(1.06);
    }
    .help:active {
      transform: translateY(1px);
    }
    .help:focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 3px;
    }
    /*
     * Visit counter: number wheels set into the right of the name strip, exactly as tall as the
     * FS-4 badge (0.68 × 1.39 brand sizes plus its padding). The wheels are 1.82 of their own font
     * size tall, padding included.
     */
    lock-counter {
      font-size: calc((0.68 * 1.39 * var(--brand-size) + 0.22rem) / 1.82);
    }
    /* Silkscreened panel text */
    .label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
      opacity: 0.92;
      text-shadow: 0 0 0.6px rgba(232, 225, 204, 0.6);
    }

    :host {
      /* On/off key width; its height follows the control row. */
      --start-width: 72px;
    }
    .label .dim {
      opacity: 0.55;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: none;
    }

    /* Display and controls: stacked, except side by side on short landscape screens (see below) */
    .panels {
      display: contents;
    }
    /* A size container: the control row's layout follows the panel's own width (see below) */
    .controls-panel {
      /* Every knob's size (input, volume, reverb), set per layout below */
      --input-knob: 60px;
      display: flex;
      flex-direction: column;
      container: controls / inline-size;
    }
    /* Padding includes the 5px the display's frame is drawn outside its box. */
    .display-section {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: calc(1.9rem + 5px) calc(2.4rem + 5px) 5px;
    }
    /*
     * A backlit LCD behind glass, so notes and graphs read as crisply as print: pale green-grey
     * with dark ink while on, unlit and dull while off.
     */
    .glass {
      --lcd-ink: #1b2620;
      /* The backlight's colour, for lettering knocked out of ink */
      --lcd-bg: #c8d1b6;
      position: relative;
      display: flex;
      flex: 1;
      flex-direction: column;
      min-height: var(--min-display, ${lr}px);
      border-radius: 4px;
      background:
        var(--grain),
        radial-gradient(ellipse at 50% 40%, #6f7864 0%, #626a57 60%, #555c4b 100%);
      background-size: 180px 180px, auto;
      /* Recessed window: dark gasket, bevelled plastic frame, highlight on the panel lip */
      box-shadow:
        inset 0 3px 12px rgba(0, 0, 0, 0.75),
        inset 0 0 0 1px rgba(0, 0, 0, 0.8),
        0 0 0 4px #141412,
        0 0 0 5px #050505,
        0 -1px 0 5px rgba(0, 0, 0, 0.5),
        0 1px 0 5px rgba(255, 255, 255, 0.09);
      overflow: hidden;
      transition: background 0.25s;
    }
    .glass.on {
      background:
        var(--grain),
        radial-gradient(ellipse at 50% 40%, #d6dfc6 0%, #c3ccb1 55%, #a7b294 100%);
      background-size: 180px 180px, auto;
    }
    .glass:not(.on) {
      --lcd-ink: rgba(20, 26, 20, 0.55);
    }
    /* Glass reflection */
    .glass::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(170deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.04) 34%, transparent 34.5%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 18%);
      pointer-events: none;
    }
    vibrato-display,
    tuner-display {
      flex: 1;
      min-height: 0;
    }

    /*
     * One row, left to right: on/off key, input gain knob, reference display (with the input meter),
     * reference tone key, tone volume knob and the tuning LED; labels share the next row. As on
     * the Tuner FS-2, but only as tall as the instrument keys (.mode) at every size.
     */
    .controls {
      --panel-height: 60px;
      --knob-size: var(--input-knob);
      --digit-size: 2.1rem;
      --display-padding: 0.45rem 0.9rem;
      /* Padding, unit and the input meter in the display (see value-display.ts) */
      --display-reserve: 6.1rem;
      display: grid;
      grid-template-columns: auto auto minmax(0, 1fr) auto auto;
      grid-template-rows: var(--panel-height) auto;
      justify-items: center;
      gap: 0.75rem 1.1rem;
      padding: 1.7rem 2.4rem 1.6rem;
    }
    .controls .volume {
      align-self: center;
    }
    .fork {
      width: 64px;
    }
    /* Tuning fork moulded into the cap, under the key LED */
    .fork-icon {
      position: absolute;
      left: 50%;
      bottom: 8px;
      width: 30px;
      height: 30px;
      margin-left: -15px;
      fill: none;
      stroke: rgba(70, 60, 42, 0.7);
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.6));
      pointer-events: none;
    }
    /* Amber LEDs behind amber-tinted glass, as on the Tuner FS-2. */
    .controls value-display {
      --segment-on: #f2a51c;
      --segment-off: rgba(242, 165, 28, 0.07);
      --segment-glow: rgba(242, 150, 20, 0.7);
      --glass-center: #33210a;
      --glass-mid: #170f04;
      --glass-edge: #0c0702;
      justify-self: stretch;
    }
    /* The input knob, centred over its label */
    .input-cell {
      display: flex;
      align-items: center;
      height: var(--panel-height);
    }

    /* Plastic keycaps seated in dark panel cut-outs */
    button {
      font: inherit;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    button:focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 4px;
    }
    .key {
      --cap-top: #f2ead4;
      --cap-mid: #e2d8bf;
      --cap-low: #c6bb9f;
      position: relative;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background:
        var(--grain),
        linear-gradient(180deg, var(--cap-top) 0%, var(--cap-mid) 55%, var(--cap-low) 100%);
      background-size: 120px 120px, auto;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.75),
        inset 0 -5px 0 rgba(0, 0, 0, 0.16),
        inset 0 -6px 3px rgba(0, 0, 0, 0.08),
        0 0 0 2px #0e0e0d,
        0 0 0 3px rgba(255, 255, 255, 0.05),
        0 5px 7px 1px rgba(0, 0, 0, 0.55);
      transition:
        transform 0.05s,
        box-shadow 0.05s;
    }
    /* Slightly dished top face */
    .key::before {
      content: '';
      position: absolute;
      inset: 5px 5px 9px;
      border-radius: 3px;
      background: radial-gradient(ellipse at 50% 20%, rgba(255, 255, 255, 0.35), transparent 70%);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.08);
      pointer-events: none;
    }
    .key:active {
      transform: translateY(2px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.6),
        inset 0 -3px 0 rgba(0, 0, 0, 0.16),
        0 0 0 2px #0e0e0d,
        0 0 0 3px rgba(255, 255, 255, 0.05),
        0 2px 3px rgba(0, 0, 0, 0.6);
    }
    .key .key-led {
      position: absolute;
      top: 9px;
      left: 50%;
      width: 10px;
      height: 10px;
      margin-left: -5px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.55) 0 1px, transparent 2.5px),
        radial-gradient(circle at 50% 50%, #6e2016, #360b06);
      box-shadow:
        0 0 0 1.5px rgba(0, 0, 0, 0.35),
        0 1px 0 1.5px rgba(255, 255, 255, 0.35);
      z-index: 1;
    }
    .key .key-led.on {
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.85) 0 1px, transparent 2.5px),
        radial-gradient(circle at 50% 50%, #ffb39f, #ff3a1c 55%, #c01a06);
      box-shadow:
        0 0 0 1.5px rgba(0, 0, 0, 0.3),
        0 0 7px 3px rgba(255, 58, 28, 0.6);
    }
    .start {
      width: var(--start-width);
    }
    /*
     * The displays' frames are drawn up to 5px outside their boxes, the keys' outline 2px; stretch
     * the keys 3px past their row so their outer edges line up with the displays.
     */
    .controls .start,
    .controls .fork {
      align-self: stretch;
      margin-block: -3px;
    }
    .start-label {
      color: #e0533d;
    }

    /* Instrument selector */
    .modes {
      display: grid;
      /* The instruments, then the tuner key */
      grid-template-columns: repeat(${L.length+1}, minmax(0, 1fr));
      gap: 0.6rem 1.2rem;
      justify-items: center;
      padding: 1.4rem 2.4rem 1.5rem;
      border-top: 1px solid rgba(0, 0, 0, 0.65);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.2));
    }
    .mode {
      justify-self: stretch;
      height: 60px;
    }
    /* The instrument and tuner keys' LEDs are green (On / Off and Tone keep red) */
    .mode .key-led {
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.55) 0 1px, transparent 2.5px),
        radial-gradient(circle at 50% 50%, #1d5a2a, #0b2812);
    }
    .mode .key-led.on {
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.85) 0 1px, transparent 2.5px),
        radial-gradient(circle at 50% 50%, #c6ffd2, #3ef06a 55%, #129c3a);
      box-shadow:
        0 0 0 1.5px rgba(0, 0, 0, 0.3),
        0 0 7px 3px rgba(62, 240, 106, 0.55);
    }
    .icon {
      width: 44px;
      height: 44px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.9;
    }
    .icon .fill {
      fill: currentColor;
    }
    .caption {
      margin-top: -0.3rem;
    }

    /*
     * Recordings, above the instrument keys and across their row: the slider, a readout with the
     * player's name, and the Play key, its name lettered above it.
     */
    .examples {
      grid-column: 1 / -1;
      justify-self: stretch;
      display: grid;
      /* Slider and name share the room, the name more of it: a fixed slider squeezed it to "JASC…" */
      grid-template-columns: minmax(120px, 1fr) minmax(150px, 1.4fr) auto auto;
      align-items: end;
      gap: 0.5rem 1.2rem;
      margin-bottom: 0.7rem;
      /*
       * Keys, knob and readout are centred on one line: each control in a box as tall as the
       * larger of key and knob (the knob as big as the input knob), its name above it
       */
      --transport-key: 40px;
      --control-h: max(var(--input-knob), var(--transport-key));
    }
    .examples .title {
      grid-column: 1 / -1;
      justify-self: start;
    }
    /*
     * Beside the readout, the slider's slot is level with the readout's middle: the row lines up
     * bottoms, the readout's middle is half the control box up, and the slot's middle sits 15px
     * above the slider's bottom (its .slot in step-slider.ts). On its own line it needs none of this.
     */
    .examples step-slider {
      margin-bottom: calc(var(--control-h) / 2 - 15px);
    }
    /* Amber lettering in a recessed window, like the display's readouts */
    .example-readout {
      display: flex;
      align-items: center;
      min-width: 0;
      height: var(--transport-key);
      margin-bottom: calc((var(--control-h) - var(--transport-key)) / 2);
      padding: 0 0.9rem;
      box-sizing: border-box;
      font: 700 1rem/1 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffb347;
      text-shadow: 0 0 6px rgba(255, 150, 50, 0.65);
      border-radius: 3px;
      background: #0a0b0a;
      box-shadow:
        inset 0 2px 6px rgba(0, 0, 0, 0.95),
        0 0 0 2px #141412,
        0 0 0 3px #050505,
        0 1px 0 3px rgba(255, 255, 255, 0.08);
    }
    .example-readout span {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    /* A note of yours: its name is a button (click to rename), then a text field in the same lettering */
    .rename-button,
    .rename {
      display: flex;
      min-width: 0;
      width: 100%;
      padding: 0;
      border: none;
      background: none;
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      text-shadow: inherit;
      color: inherit;
      text-align: left;
      cursor: text;
    }
    .rename-button span {
      text-decoration: underline dotted rgba(255, 179, 71, 0.45);
      text-underline-offset: 4px;
    }
    .rename {
      outline: none;
      caret-color: #ffb347;
    }
    .example-readout.editing {
      outline: 1px solid rgba(255, 179, 71, 0.6);
      outline-offset: -4px;
    }
    .example-key {
      display: grid;
      grid-template-rows: auto var(--control-h);
      justify-items: center;
      align-items: center;
      gap: 0.45rem;
    }
    /* Reverb on playback, right of Play, as big as the input knob */
    .examples .reverb {
      --knob-size: var(--input-knob);
    }
    /*
     * Volume ends the control row and Reverb the example row below it: both in a column of the
     * same width at the same right edge (the panels' padding matches), so the two knobs line up
     */
    .controls,
    .examples {
      --knob-col: calc(var(--input-knob) + 1rem);
    }
    .controls .volume-label,
    .example-key.knob-key {
      width: var(--knob-col);
    }
    /*
     * Play, Polka FS-3's transport key in the panel's cream: the icon on the cap, no LED;
     * playing, the key turns into Stop and its icon lights up green.
     */
    .key.transport-key {
      display: grid;
      place-items: center;
      width: 52px;
      height: var(--transport-key);
      padding: 0 0 4px;
      color: rgba(40, 37, 30, 0.82);
    }
    .transport-key.active {
      --glow: #4cdf6a;
    }
    .transport-key:disabled {
      cursor: default;
    }
    .transport-key:disabled .cap-icon {
      opacity: 0.3;
    }
    .transport-key.active .cap-icon {
      color: color-mix(in srgb, var(--glow) 35%, white);
      filter: drop-shadow(0 0 2px var(--glow)) drop-shadow(0 0 5px var(--glow));
    }
    .cap-icon {
      position: relative;
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    /* Phones: the slider across the panel, the readout and keys on the line below */
    @media (max-width: 720px) {
      .examples {
        grid-template-columns: minmax(0, 1fr) auto auto;
        row-gap: 0.4rem;
      }
      .examples step-slider {
        grid-column: 1 / -1;
        margin-bottom: 0;
      }
    }
    /*
     * Phones held sideways: no height for another line, so a shorter slider, smaller lettering and
     * key keep all three on one.
     */
    @media (orientation: landscape) and (max-height: 520px) {
      .examples {
        grid-template-columns: minmax(80px, 110px) minmax(0, 1fr) auto auto;
        column-gap: 0.5rem;
        margin-bottom: 0.3rem;
        /* As Polka's transport keys on short screens */
        --transport-key: 34px;
      }
      .examples step-slider {
        grid-column: auto;
      }
      .example-readout {
        padding: 0 0.6rem;
        font-size: 0.8rem;
        letter-spacing: 0.04em;
      }
      .key.transport-key {
        width: 42px;
      }
      .example-key {
        gap: 0.25rem;
      }
      .example-key .label {
        font-size: 0.54rem;
      }
    }
    /*
     * Larger screens, the slider beside the readout: two lines, every name on the first
     * ("Recordings" level with Play and Reverb), every control centred on the second. The key
     * columns dissolve (display: contents) so their names and controls take a line each.
     */
    @media (min-width: 721px) and (orientation: portrait), (min-width: 721px) and (min-height: 521px) {
      .examples .title {
        grid-row: 1;
        grid-column: 1 / 3;
        align-self: end;
      }
      .example-key {
        display: contents;
      }
      .example-key > .label {
        grid-row: 1;
        align-self: end;
        justify-self: center;
      }
      .example-key > :not(.label),
      .example-readout {
        grid-row: 2;
        align-self: center;
        justify-self: center;
        margin-bottom: 0;
      }
      .example-readout {
        justify-self: stretch;
      }
      /* As wide as the volume column above it (the column was its wrapper's width) */
      .example-key.knob-key > .label {
        width: var(--knob-col);
        text-align: center;
      }
      /* Centred, its slot (15px above its foot, 8px below its middle) level with the readout */
      .examples step-slider {
        grid-row: 2;
        align-self: center;
        margin-bottom: 0;
        transform: translateY(-8px);
      }
    }

    footer {
      padding: 0.7rem 2.4rem 0.8rem;
      font-size: 0.68rem;
      text-align: center;
      color: rgba(232, 225, 204, 0.45);
      border-top: 1px solid rgba(0, 0, 0, 0.6);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    kbd {
      font: inherit;
      font-weight: 700;
      padding: 0 0.3em;
      border: 1px solid rgba(232, 225, 204, 0.35);
      border-radius: 3px;
    }

    /*
     * Tip button between the name and the badges: a key like the others, but with a cap of brushed
     * aluminium, so it looks machined from the strip it sits in; the cup and lettering are etched
     * like the logo.
     */
    .tip-button {
      display: flex;
      flex: none;
      align-items: center;
      gap: 0.45rem;
      /* As tall as the FS-4 badge and the visit counter */
      height: calc(0.68 * 1.39 * var(--brand-size) + 0.22rem);
      padding: 0 0.85rem 0 0.7rem;
      box-sizing: border-box;
      white-space: nowrap;
      font-family: var(--label-font);
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      color: rgba(34, 32, 27, 0.85);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
      border-radius: 5px;
      background:
        var(--brushed),
        linear-gradient(180deg, #f6f6f1 0%, #d6d6d0 48%, #c0c0ba 52%, #b2b2ac 100%);
      background-size: 300px 60px, auto;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        inset 0 -2px 0 rgba(0, 0, 0, 0.2),
        0 0 0 1.5px #2b2a26,
        0 0 0 2.5px rgba(255, 255, 255, 0.4),
        0 3px 4px rgba(0, 0, 0, 0.45);
      -webkit-tap-highlight-color: transparent;
      transition:
        transform 0.05s,
        box-shadow 0.05s,
        filter 0.15s;
    }
    .tip-button:hover {
      filter: brightness(1.06);
    }
    .tip-button:active {
      transform: translateY(1.5px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.7),
        inset 0 -1px 0 rgba(0, 0, 0, 0.2),
        0 0 0 1.5px #2b2a26,
        0 0 0 2.5px rgba(255, 255, 255, 0.4),
        0 1px 2px rgba(0, 0, 0, 0.5);
    }
    .tip-button:focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 4px;
    }
    .tip-icon {
      flex: none;
      width: 1.5em;
      height: 1.5em;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0.8px 0 rgba(255, 255, 255, 0.65));
    }
    /* Narrow screens: no room in the strip, so the tip moves to the line under the device */
    @media (max-width: ${as-1}px) {
      .tip-button {
        display: none;
      }
    }
    @media (min-width: ${as}px) {
      .tip {
        display: none;
      }
    }
    /*
     * Tip line under the device. The page behind it may be light or dark, so it uses a mid-tone
     * that reads on both.
     */
    .tip {
      margin: 1.1rem 0 0;
      font-size: 0.78rem;
      line-height: 1.5;
      text-align: center;
      color: #8c8577;
    }
    /* Where the full sentence would wrap, fitTip() switches to just the link. */
    .tip-short,
    .tip.short .tip-long {
      display: none;
    }
    .tip.short .tip-short {
      display: inline;
    }
    .tip a {
      color: #e0533d;
      font-weight: 700;
      text-decoration: none;
      border-radius: 2px;
      -webkit-tap-highlight-color: transparent;
    }
    .tip a:hover {
      text-decoration: underline;
    }
    .tip a:focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 3px;
    }

    /*
     * Only where even the tight single row (see the end) doesn't fit (a panel under 280px: the
     * smallest phones, phones sideways with the narrow controls panel): two rows on four columns.
     * On/off key and input knob (across the rest of the row) on top; the
     * reference display under the first two, with the tone key and volume knob to its right.
     */
    @container controls (max-width: 279px) {
      .controls {
        grid-template-columns: auto minmax(0, 1fr) auto auto;
        grid-template-rows: var(--panel-height) auto var(--panel-height) auto;
      }
      .controls .start {
        grid-area: 1 / 1;
      }
      /* The knob and its label centred in the rest of the top row */
      .controls .input-cell,
      .controls .input-label {
        justify-self: center;
      }
      .controls .input-cell {
        grid-area: 1 / 2 / 2 / 5;
      }
      .controls .start-label {
        grid-area: 2 / 1;
      }
      .controls .input-label {
        grid-area: 2 / 2 / 3 / 5;
      }
      .controls value-display {
        grid-area: 3 / 1 / 4 / 3;
      }
      .controls .fork {
        grid-area: 3 / 3;
      }
      .controls .volume {
        grid-area: 3 / 4;
      }
      .controls .ref-label {
        grid-area: 4 / 1 / 5 / 3;
      }
      .controls .tone-label {
        grid-area: 4 / 3;
      }
      .controls .volume-label {
        grid-area: 4 / 4;
      }
    }

    @media (max-width: 720px), (orientation: landscape) and (max-height: 520px) {
      :host {
        --start-width: 64px;
      }
      .cheek {
        flex-basis: 12px;
      }
      header {
        padding: 0.9rem 2.2rem 0.75rem 1.6rem;
      }
      .display-section {
        padding: calc(1.25rem + 5px) calc(1rem + 5px) 5px;
      }
      /* Compact controls; the digits shrink with the screen so the display row always fits. */
      .controls {
        --panel-height: 52px;
        --digit-size: clamp(1.5rem, 6vw, 1.8rem);
        --display-padding: 0.35rem 0.7rem;
        --display-reserve: 5.7rem;
        gap: 0.6rem 0.6rem;
        padding: 1.25rem 1rem;
      }
      .controls-panel {
        --input-knob: 52px;
      }
      .fork {
        width: 56px;
      }
      .fork-icon {
        bottom: 6px;
        width: 26px;
        height: 26px;
        margin-left: -13px;
      }
      .ref-label .dim {
        display: none;
      }
      .label {
        white-space: normal;
      }
      /*
       * Except under the control row: "On / Off" is wider than its key there (in Helvetica, on
       * iPhones), and wrapped it stood a line taller than "Input" beside it. On one line it
       * overflows its narrow column evenly either side, into the gaps.
       */
      .controls .label {
        white-space: nowrap;
      }
      .modes {
        gap: 0.5rem 0.6rem;
        padding: 1.25rem 1rem;
      }
      .mode {
        height: 52px;
      }
      .icon {
        width: 36px;
        height: 36px;
      }
      /* Keyboard hints are no use on touch screens; keep the strip for the screws. */
      footer {
        padding: 0;
        height: 30px;
      }
      .hints {
        display: none;
      }
    }

    /*
     * Narrower than today's phones: the reference display gets a row of its own, with the tone key
     * and volume knob below it, and the instrument captions don't run together.
     */
    @container controls (max-width: 259px) {
      .controls {
        grid-template-rows: repeat(3, var(--panel-height) auto);
      }
      .controls value-display {
        grid-area: 3 / 1 / 4 / 5;
      }
      .controls .ref-label {
        grid-area: 4 / 1 / 5 / 5;
      }
      .controls .fork {
        grid-area: 5 / 3;
      }
      .controls .volume {
        grid-area: 5 / 4;
      }
      .controls .tone-label {
        grid-area: 6 / 3;
      }
      .controls .volume-label {
        grid-area: 6 / 4;
      }
      .caption {
        letter-spacing: 0.06em;
      }
    }
    /*
     * Six keys share the row on phones and in the landscape controls panel: smaller, tighter
     * captions, so "Flute", "Trumpet" and "Tuner" keep clear of each other.
     */
    @media (max-width: 720px), (orientation: landscape) and (max-height: 520px) {
      .modes {
        column-gap: 0.4rem;
      }
      .caption {
        font-size: 0.56rem;
        letter-spacing: 0.04em;
      }
    }

    /*
     * Phones in portrait: slimmer header, padding, instrument keys and footer, so the display
     * keeps as much height as it can.
     */
    @media (max-width: 720px) and (orientation: portrait) {
      :host {
        --min-display: 200px;
      }
      header {
        padding: 0.6rem 2.2rem 0.5rem 1.6rem;
      }
      /* As tall as the instrument keys here (44px) */
      .controls {
        --panel-height: 44px;
        --digit-size: clamp(1.3rem, 5.5vw, 1.6rem);
        --display-padding: 0.25rem 0.6rem;
        padding: 1rem;
      }
      .controls-panel {
        --input-knob: 44px;
      }
      .controls .key-led {
        top: 6px;
      }
      .fork {
        width: 52px;
      }
      .fork-icon {
        bottom: 5px;
        width: 22px;
        height: 22px;
        margin-left: -11px;
      }
      .modes {
        gap: 0.4rem 0.6rem;
        padding: 0.8rem 1rem 0.9rem;
      }
      .mode {
        height: 44px;
      }
      .icon {
        width: 28px;
        height: 28px;
      }
      footer {
        height: 20px;
      }
      .tip {
        margin-top: 0.5rem;
      }
    }

    /*
     * Landscape on phones (and other short screens): the display on the left at full height, the
     * controls panel beside it, so the device spans the full width instead of shrinking to fit the
     * height. A groove divides the two; everything is sized down to fit a phone's height.
     */
    @media (orientation: landscape) and (max-height: 520px) {
      :host {
        --start-width: 64px;
        --min-display: 150px;
      }
      .panels {
        display: grid;
        flex: 1;
        min-height: 0;
        grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
      }
      .display-section {
        padding: calc(0.8rem + 5px) calc(0.8rem + 5px) calc(0.8rem + 5px) calc(0.8rem + 15px);
        border-right: 1px solid rgba(0, 0, 0, 0.65);
        box-shadow: 1px 0 0 rgba(255, 255, 255, 0.06);
      }
      .controls-panel {
        justify-content: center;
      }
      header {
        --brand-size: 1.25rem;
        padding: 0.4rem 2.2rem 0.35rem 1.6rem;
      }
      /* As tall as the instrument keys here (44px) */
      .controls {
        --panel-height: 44px;
        --digit-size: 1.5rem;
        --display-padding: 0.25rem 0.6rem;
        row-gap: 0.35rem;
        padding: 0.8rem 1rem 0.5rem;
      }
      .controls-panel {
        --input-knob: 44px;
      }
      /*
       * Keys and display exactly the instrument keys' height: the keys don't reach past the row,
       * and the display's frame (5px outside its box, the keys' outline 2px) ends where theirs
       * does. Spaced like the instrument keys (more specific than the narrow-panel gaps, which
       * would win otherwise); the display gives up the width.
       */
      .controls .start,
      .controls .fork {
        margin-block: 0;
      }
      .controls value-display {
        align-self: center;
        height: calc(var(--panel-height) - 6px);
      }
      .controls-panel .controls {
        column-gap: 0.5rem;
      }
      .controls .key-led {
        top: 6px;
      }
      .fork {
        width: 52px;
      }
      .fork-icon {
        bottom: 5px;
        width: 22px;
        height: 22px;
        margin-left: -11px;
      }
      /* Instrument keys in one row: keys and captions, no icons. */
      .modes {
        gap: 0.3rem 0.5rem;
        padding: 0.5rem 1rem 0.6rem;
      }
      .mode {
        height: 44px;
      }
      .mode .key-led {
        top: 6px;
      }
      .icon {
        display: none;
      }
      .caption {
        margin-top: 0;
      }
      footer {
        height: 16px;
      }
      .tip {
        margin-top: 0.35rem;
      }
    }

    /*
     * A narrow controls panel (phones, either way up): the control row stays one line, tightened.
     * Smaller knobs, keys, LED and gaps; the Hz display drops its unit (the label names it) and
     * most of its padding, so its digits keep a readable size; the input label puts the gain under
     * "Input", as the knob and meter are too narrow for both side by side.
     */
    @container controls (max-width: 520px) {
      /* (set on the panel's children: a container query can't style the container itself) */
      .controls,
      .examples {
        --input-knob: 40px;
      }
      .controls {
        --digit-size: 1.6rem;
        --display-padding: 0.25rem 0.4rem;
        --display-reserve: 3.2rem;
        --unit-display: none;
        column-gap: 0.25rem;
        /* As the instrument row's, so On / Off lines up with Violin and Volume with Reverb */
        padding-inline: 1rem;
      }
      .controls .start {
        width: 44px;
      }
      .controls .fork {
        width: 44px;
      }
      .controls .fork-icon {
        bottom: 5px;
        width: 22px;
        height: 22px;
        margin-left: -11px;
      }
      .controls .key-led {
        top: 6px;
      }
      .controls .label {
        font-size: 0.56rem;
        letter-spacing: 0.06em;
      }
      /*
       * The player's name, Play and Reverb stay on one line: narrower keys, a smaller knob,
       * tighter gaps and lettering leave the name its room
       */
      .examples {
        grid-template-columns: minmax(0, 1fr) auto auto;
        column-gap: 0.5rem;
      }
      /* (also in the landscape panel, where it would otherwise share their line) */
      .examples step-slider {
        grid-column: 1 / -1;
        margin-bottom: 0;
      }
      .example-readout {
        padding: 0 0.5rem;
        font-size: 0.8rem;
        letter-spacing: 0.02em;
      }
      .key.transport-key {
        width: 40px;
      }
      .example-key .label {
        font-size: 0.54rem;
        letter-spacing: 0.08em;
      }
    }

    /*
     * The narrowest panels (360–375px phones): everything beside the Hz display gives up a few
     * pixels, so its digits stay readable.
     */
    @container controls (max-width: 339px) {
      .controls,
      .examples {
        --knob-col: calc(var(--input-knob) + 0.25rem);
      }
      .controls {
        --display-padding: 0.2rem 0.3rem;
        --display-reserve: 2.4rem;
        column-gap: 0.2rem;
      }
      .controls .start,
      .controls .fork {
        width: 40px;
      }
      .controls input-meter,
      .controls tune-meter {
        --inset-led-width: 6px;
      }
    }
